<div class="clo-overlay" *ngIf="loading" role="status" aria-live="polite" aria-label="Loading">
  <div class="clo-spinner">
    <svg class="clo-ring" viewBox="0 0 100 100" width="72" height="72" aria-hidden="true">
      <circle class="clo-track" cx="50" cy="50" r="42" fill="none" stroke-width="7"></circle>
      <circle class="clo-arc" cx="50" cy="50" r="42" fill="none" stroke-width="7"></circle>
    </svg>
  </div>
  <div class="clo-text">Loading, please wait...</div>
</div>
