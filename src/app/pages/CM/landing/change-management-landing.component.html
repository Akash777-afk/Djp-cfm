<!-- top=32 matches NOC Portal's sidebar (see noc-portal.component.scss's
     .np-sidebar top) so the rail starts at the same vertical position
     in both modules — no longer tied to the stat cards' own offset. -->
<app-cm-sidebar-nav [scale]="scale" [top]="32" [items]="sidebarItems" (itemClick)="onSidebarItemClick($event)"></app-cm-sidebar-nav>
<app-cm-create-po-modal
  [isOpen]="isCreatePoModalOpen"
  (closed)="onCreatePoModalClosed()"
></app-cm-create-po-modal>
<app-cm-service-impact-modal
  [isOpen]="isServiceImpactModalOpen"
  (closed)="onServiceImpactModalClosed()"
></app-cm-service-impact-modal>
<app-cm-contact-centre-modal
  [isOpen]="isContactCentreModalOpen"
  (closed)="onContactCentreModalClosed()"
></app-cm-contact-centre-modal>

<div class="cml-scale-wrapper" [style.--cml-scale]="scale">
<div class="cml-canvas">

  <app-cml-top-bar
    [userName]="userName"
    (callClick)="onCallClick()"
    (bookClick)="onBookClick()"
  ></app-cml-top-bar>
  <app-cml-stat-cards [cards]="statCards" (cardClick)="setActiveCard($event)"></app-cml-stat-cards>

  <app-cml-changes-panel
    [changes]="changes"
    [statusFilter]="statusFilter"
    (changeIdClick)="goToCrq($event)"
    (dateRangeSearch)="onDateRangeSearch($event)"
  ></app-cml-changes-panel>

  <!-- ===== Footer ===== -->
  <div class="the-main-page">
    <a class="tier-1" href="https://www.tieroneoss.com" target="_blank" rel="noopener noreferrer">
      <div class="powered-by">Powered by</div>
      <img class="t1-4-icon" src="\assets/shared/im-3-tier1.png" alt="" />
    </a>
  </div>

</div>
</div>
