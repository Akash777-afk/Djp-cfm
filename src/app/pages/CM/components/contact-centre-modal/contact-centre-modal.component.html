<div class="cc-overlay" *ngIf="isOpen" role="presentation" (click)="close()">
  <div class="cc-card" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">

    <div class="cc-header">
      <div class="cc-title">Contact centre</div>
      <div class="cc-close" role="button" tabindex="0" aria-label="Close" (click)="close()" (keyup.enter)="close()">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 5L15 15M15 5L5 15" stroke="#9ca3af" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <div class="cc-filter-bar">
      <div class="cc-field">
        <div class="cc-field-label">LSI Number</div>
        <div class="cc-field-box">
          <input class="cc-input" type="text" placeholder="Enter the LSI Number" [(ngModel)]="lsiNumber" (keyup.enter)="search()" />
          <img class="cc-field-icon" src="/assets/shared/Dropdown-topbar.svg" alt="" />
        </div>
      </div>
      <div class="cc-actions">
        <button type="button" class="cc-reset-btn" (click)="reset()">Reset</button>
        <button type="button" class="cc-search-btn" (click)="search()">Search</button>
      </div>
    </div>

  </div>
</div>
