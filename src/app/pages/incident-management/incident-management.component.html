<app-sidebar-nav></app-sidebar-nav>

<div class="the-djp-incident-management-scale-wrapper" [style.--djp-scale]="scale">
<div class="the-djp-incident-management">

  <app-top-bar
    [pageTitle]="pageTitle"
    [searchPlaceholder]="searchPlaceholder"
    [lastUpdated]="lastUpdated"
    [searchQuery]="searchQuery"
    (searchQueryChange)="searchQuery = $event"
    (search)="onSearch()"
    (menuClick)="onMenuClick()"
    (refreshClick)="onTopbarRefresh()"
  ></app-top-bar>

  <app-nstt-status
    [statTiles]="statTiles"
    (refreshClick)="onNsttStatusRefresh()"
  ></app-nstt-status>

  <app-all-nstts [nsttRows]="nsttRows"></app-all-nstts>

  <!-- ===== Footer ===== -->
  <div class="the-main-page">
    <div class="tier-1">
      <div class="powered-by">Powered by</div>
      <img class="t1-4-icon" src="\assets\im-3-tier1.png" alt="" />
    </div>
  </div>

</div>
</div>
