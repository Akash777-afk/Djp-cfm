<!-- ===== Status cards — same design as Change Management's stat cards
     (app-cml-stat-cards): title top-left, icon badge top-right, count,
     "View X" + arrow bottom, colored bottom border. No wrapping panel or
     heading — just the 8 cards. ===== -->
<div class="im-stat-row">
  <div
    class="im-stat-card"
    *ngFor="let tile of statTiles; let i = index"
    [class.im-stat-card-active]="tile.key === activeKey"
    [style.left.px]="i * 232"
    [style.--stat-color]="tile.borderColor"
    [style.--stat-bg]="tile.bg"
    role="button"
    tabindex="0"
    (click)="tileClick.emit(tile.key)"
    (keyup.enter)="tileClick.emit(tile.key)"
  >
    <div class="im-stat-label">{{ tile.label }}</div>
    <div class="im-stat-icon-badge">
      <img [src]="tile.icon" alt="" />
    </div>
    <div class="im-stat-count">{{ tile.value }}</div>
    <div class="im-stat-view">{{ tile.viewText }}</div>
    <div class="im-stat-arrow" [class.im-stat-arrow-down]="tile.key === activeKey">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
</div>
