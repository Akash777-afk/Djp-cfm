<div class="im-header-fixed" [style.--header-scale]="scale">

  <!-- ===================== TOP BAR ===================== -->
  <div class="im-topbar">
    <img class="im-topbar-logo" src="/assets/shared/Airtel-logo 5.png" alt="Airtel logo" />
    <img class="im-topbar-banner" src="/assets/shared/header-topright2.png" alt="" />
    <div class="im-topbar-divider"></div>
  </div>

  <!-- ===================== BREADCRUMB ===================== -->
  <div class="im-breadcrumb">
    <img *ngIf="!breadcrumbText" class="im-breadcrumb-label" [src]="breadcrumbImage" [alt]="breadcrumbAlt" />
    <div *ngIf="breadcrumbText" class="im-breadcrumb-label-text">
      <svg viewBox="0 0 20 20" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="8" height="8" rx="2"/>
        <rect x="12" y="0" width="8" height="8" rx="2"/>
        <rect x="0" y="12" width="8" height="8" rx="2"/>
        <rect x="12" y="12" width="8" height="8" rx="2"/>
      </svg>
      <span>{{ breadcrumbText }}</span>
    </div>
    <img class="im-breadcrumb-actions" src="/assets/shared/Screenshot%202026-07-28%20121148.png" alt="" />
  </div>

</div>
