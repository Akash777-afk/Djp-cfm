<div class="ls-overlay" *ngIf="isOpen" role="presentation" (click)="close()">
  <div class="ls-card" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">

    <div class="ls-header">
      <div class="ls-title">Link Status</div>
      <div class="ls-header-actions">
        <button type="button" class="ls-icon-btn" [class.spinning]="isRefreshing" aria-label="Refresh" (click)="onRefresh()">
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16.5 10a6.5 6.5 0 1 1-2.1-4.8M16.5 3v4h-4" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button type="button" class="ls-icon-btn" aria-label="Close" (click)="close()">
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 5L15 15M15 5L5 15" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="ls-body">

      <div class="ls-top-row">

        <div class="ls-domain-field">
          <div class="ls-field-label">Domain</div>
          <div class="ls-domain-box">
            <label class="ls-checkbox-row" *ngFor="let d of domainOptions">
              <input type="checkbox" [(ngModel)]="d.checked" />
              {{ d.label }}
            </label>
          </div>
        </div>

        <div class="ls-right-col">
          <div class="ls-field">
            <div class="ls-field-label">IP Address</div>
            <div class="ls-field-box">
              <input class="ls-input" type="text" placeholder="Enter IP Address" [(ngModel)]="ipAddress" />
            </div>
          </div>

          <div class="ls-field-row">
            <div class="ls-field">
              <div class="ls-field-label">PING</div>
              <div class="ls-field-box">
                <select class="ls-select" [(ngModel)]="pingOption" [class.is-placeholder]="!pingOption">
                  <option value="" disabled hidden>Select PING option</option>
                  <option *ngFor="let o of pingOptions" [ngValue]="o">{{ o }}</option>
                </select>
                <img class="ls-field-icon" src="/assets/shared/Dropdown-topbar.svg" alt="" />
              </div>
            </div>
            <div class="ls-field">
              <div class="ls-field-label">MIU</div>
              <div class="ls-field-box">
                <select class="ls-select" [(ngModel)]="miuOption" [class.is-placeholder]="!miuOption">
                  <option value="" disabled hidden>Select MIU option</option>
                  <option *ngFor="let o of miuOptions" [ngValue]="o">{{ o }}</option>
                </select>
                <img class="ls-field-icon" src="/assets/shared/Dropdown-topbar.svg" alt="" />
              </div>
            </div>
          </div>

          <div class="ls-actions">
            <button type="button" class="ls-reset-btn" (click)="reset()">Reset</button>
            <button type="button" class="ls-submit-btn" (click)="submit()">Submit</button>
          </div>
        </div>

      </div>

      <div class="ls-command-section">
        <div class="ls-command-title">Command Executed</div>

        <div class="ls-command-selects">
          <div class="ls-field-box">
            <select class="ls-select" [(ngModel)]="commandSelect1" [class.is-placeholder]="!commandSelect1">
              <option value="" disabled hidden>Select PING option</option>
              <option *ngFor="let o of pingOptions" [ngValue]="o">{{ o }}</option>
            </select>
            <img class="ls-field-icon" src="/assets/shared/Dropdown-topbar.svg" alt="" />
          </div>
          <div class="ls-field-box">
            <select class="ls-select" [(ngModel)]="commandSelect2" [class.is-placeholder]="!commandSelect2">
              <option value="" disabled hidden>Select PING option</option>
              <option *ngFor="let o of pingOptions" [ngValue]="o">{{ o }}</option>
            </select>
            <img class="ls-field-icon" src="/assets/shared/Dropdown-topbar.svg" alt="" />
          </div>
        </div>

        <!-- Static shell only — no live output wired up, matches how every
             other NOC Portal action in this app currently behaves. -->
        <div class="ls-command-output">
          <span class="ls-command-placeholder">Command interface</span>
          <svg class="ls-resize-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 2L2 14M14 8L8 14" stroke="#9ca3af" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

    </div>

  </div>
</div>
