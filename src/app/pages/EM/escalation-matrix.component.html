<div class="the-djp-escalation-matrix-scale-wrapper" [style.--djp-scale]="scale">
<div class="the-djp-escalation-matrix">

  <!-- ===== Welcome banner ===== -->
  <div class="im-welcome">Welcome back, {{ userName }} !</div>
  <button type="button" class="im-quick-btn im-quick-book" aria-label="Knowledge Management" (click)="onBookClick()">
    <img src="/assets/escalation-matrix/Knowledge-managemnt.svg" alt="" />
    <span class="header-icon-tooltip">Knowledge Management</span>
  </button>
  <app-escalation-levels
    [tiles]="levelTiles"
    [activeKey]="activeCardKey"
    (tileClick)="setActiveCard($event)"
  ></app-escalation-levels>

  <app-escalated-srs
    [rows]="srRows"
    [levelFilter]="levelFilter"
    (rowClick)="onRowClick($event)"
    (lsiClick)="onLsiClick($event)"
    (refreshClick)="onTableRefresh()"
  ></app-escalated-srs>

  <!-- ===== Footer ===== -->
  <div class="the-main-page">
    <a class="tier-1" href="https://www.tieroneoss.com" target="_blank" rel="noopener noreferrer">
      <div class="powered-by">Powered by</div>
      <img class="t1-4-icon" src="\assets/shared/im-3-tier1.png" alt="" />
    </a>
  </div>

</div>
</div>
