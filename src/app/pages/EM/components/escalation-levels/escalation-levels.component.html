<!-- ===== Escalation cards (Count + L1-L6) — same design as Change
     Management's app-cml-stat-cards: title top-left, icon badge top-right,
     count, "View X" + arrow bottom, colored bottom border. No wrapping
     panel or heading — just the 7 cards. Icon is recolored to the card's
     own accent via a CSS mask (see .el-stat-icon) rather than shown at its
     original PNG color. ===== -->
<div class="el-card-row">
  <div
    class="el-stat-card"
    *ngFor="let tile of tiles; let i = index"
    [class.el-stat-card-active]="tile.key === activeKey"
    [style.left.px]="i * 267"
    [style.--stat-color]="tile.accent"
    [style.--stat-bg]="tile.bg"
    role="button"
    tabindex="0"
    (click)="tileClick.emit(tile.key)"
    (keyup.enter)="tileClick.emit(tile.key)"
  >
    <div class="el-stat-label">{{ tile.label }}</div>
    <div class="el-stat-icon-badge">
      <div
        class="el-stat-icon"
        [style.background-color]="tile.accent"
        [ngStyle]="{
          '-webkit-mask-image': 'url(&quot;' + tile.icon + '&quot;)',
          '-webkit-mask-size': 'contain',
          '-webkit-mask-repeat': 'no-repeat',
          '-webkit-mask-position': 'center',
          'mask-image': 'url(&quot;' + tile.icon + '&quot;)',
          'mask-size': 'contain',
          'mask-repeat': 'no-repeat',
          'mask-position': 'center'
        }"
      ></div>
    </div>
    <div class="el-stat-count">{{ tile.value }}</div>
    <div class="el-stat-view">{{ viewText(tile) }}</div>
    <div class="el-stat-arrow" [class.el-stat-arrow-down]="tile.key === activeKey">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
</div>
