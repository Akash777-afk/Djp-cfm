<div class="rectangle-parent">
  <div class="group-child"></div>
  <div class="group-parent">
    <div class="group-container">

      <!-- Heading row -->
      <div class="group-div">
        <div class="escalation-levels-parent">
          <div class="container"></div>
          <b class="escalation-levels">Escalation levels</b>
        </div>
        <img
          class="frame-icon"
          src="\assets/shared/Refresh.png"
          alt="Refresh"
          role="button"
          tabindex="0"
          (click)="refreshClick.emit()"
          (keyup.enter)="refreshClick.emit()"
        />
      </div>

      <!-- Tiles row -->
      <div class="container-parent">
        <div
          class="level-tile"
          *ngFor="let tile of tiles; let i = index"
          [class.level-tile-active]="tile.key === activeKey"
          [style.left.px]="i * 259"
          [style.backgroundColor]="tile.bg"
          [style.borderTopColor]="tile.accent"
          [style.borderRightColor]="tile.accent"
          [style.borderBottomColor]="tile.accent"
          [style.color]="tile.accent"
          role="button"
          tabindex="0"
          (click)="tileClick.emit(tile.key)"
          (keyup.enter)="tileClick.emit(tile.key)"
        >
          <!-- Icon box -->
          <div class="tile-icon-box" [style.borderColor]="tile.accent">
            <img
              class="tile-icon"
              [class.tile-icon-compact]="tile.key === 'level-1' || tile.key === 'level-2' || tile.key === 'level-3'"
              [src]="tile.icon"
              alt=""
            />
          </div>

          <!-- Label -->
          <div class="tile-label">{{ tile.label }}</div>
          <!-- Value -->
          <b class="tile-value">{{ tile.value }}</b>

          <!-- Bottom pill: dot track for level tiles, plain text for the 'all' tile -->
          <div class="tile-pill" [style.borderColor]="tile.accent">
            <ng-container *ngIf="tile.filledDots > 0; else pillTextTpl">
              <span
                class="dot"
                *ngFor="let d of dotSlots"
                [class.dot-filled]="d < tile.filledDots"
                [style.backgroundColor]="d < tile.filledDots ? tile.accent : null"
              ></span>
            </ng-container>
            <ng-template #pillTextTpl>
              <span class="pill-text">{{ tile.pillText }}</span>
            </ng-template>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
