<!-- ===== Analytics Header + Controls (desktop) ===== -->
<div class="container-parent" *ngIf="variant === 'desktop'">

  <!-- Analytics title -->
  <div class="analytics-overview-parent">
    <div class="analytics-overview">{{ analyticsTitle }}</div>
    <div class="real-time-insights-and">{{ analyticsSubtitle }}</div>
  </div>

  <!-- Nav tabs pill bar -->
  <div class="container7">
    <button
      type="button"
      class="nav-tab-btn"
      *ngFor="let tab of navTabs"
      [class.tab-active]="tab.active"
      (click)="tabSelect.emit(tab)"
    >
      <span class="incident-management">{{ tab.label }}</span>
    </button>
  </div>

  <!-- Interface toggle -->
  <div class="container">
    <div class="container2" [class.iface-active]="activeInterface === 'classic'" (click)="interfaceSelect.emit('classic')">
      <span class="monitoricon icon-classic"></span>
      <div class="text">
        <div class="classic-interface">Classic Interface</div>
      </div>
    </div>
    <div class="container3" (click)="interfaceSelect.emit(activeInterface === 'classic' ? 'enhanced' : 'classic')">
  <div class="container4" [class.knob-classic]="activeInterface === 'classic'">
    <div class="container5"></div>
  </div>
</div>
    <div class="container6" [class.iface-active]="activeInterface === 'enhanced'" (click)="interfaceSelect.emit('enhanced')">
      <span class="monitoricon icon-enhanced"></span>
      <div class="text">
        <div class="enhanced-interface">Enhanced Interface</div>
      </div>
    </div>
  </div>
</div>

<!-- ===== Analytics Header + Controls (mobile) ===== -->
<div class="m-analytics-header" *ngIf="variant === 'mobile'">
  <div class="m-analytics-title-block">
    <div class="m-analytics-title">{{ analyticsTitle }}</div>
    <div class="m-analytics-subtitle">{{ analyticsSubtitle }}</div>
  </div>

  <div class="m-tabs">
    <button
      type="button"
      class="m-tab-btn"
      *ngFor="let tab of navTabs"
      [class.m-tab-active]="tab.active"
      (click)="tabSelect.emit(tab)"
    >{{ tab.label }}</button>
  </div>

  <div class="m-iface-toggle">
    <button
      type="button"
      class="m-iface-btn"
      [class.m-iface-active]="activeInterface === 'classic'"
      (click)="interfaceSelect.emit('classic')"
    >
      <img src="/assets/classic-ui.svg" alt="" />
      <span>Classic Interface</span>
    </button>
    <button
      type="button"
      class="m-iface-btn"
      [class.m-iface-active]="activeInterface === 'enhanced'"
      (click)="interfaceSelect.emit('enhanced')"
    >
      <img src="/assets/modern-ui.svg" alt="" />
      <span>Enhanced Interface</span>
    </button>
  </div>
</div>
