<!-- ===== Topbar (desktop) ===== -->
<div class="rectangle-group" *ngIf="variant === 'desktop'">
  <div class="group-child12"></div>
  <img class="airtel-logo-4-icon" src="\assets\Airtel-logo 5.png" alt="Airtel" />

  <div class="text-input">
    <img class="icon" src="\assets\Search-topbar.svg" alt="" />
    <input
      type="text"
      class="search-services-devices search-input"
      [ngModel]="searchQuery"
      (ngModelChange)="onSearchQueryInput($event)"
      [placeholder]="searchPlaceholder"
      (keyup.enter)="onSearch()"
      aria-label="Search service requests, escalations and incidents"
    />
  </div>

  <div class="walk-through-our-exclusive-dig-parent">
    <div class="welcome-to-cmf-row">
      <div class="welcome-to-cmf">{{ portalTitle }}</div>
      <img class="emoji-icon" src="\assets\welcome-dude.png" alt="" />
    </div>
    <div class="walk-through-our">{{ portalSubtitle }}</div>
  </div>

  <div class="button-parent">
    <button type="button" class="button5" aria-label="Documents" (click)="documentsClick.emit()">
      <img class="famiconsdocuments-outline" src="\assets\Documentation-topbar.svg" alt="" />
    </button>
    <button type="button" class="button5" aria-label="Notifications" (click)="notificationsClick.emit()">
      <img class="famiconsdocuments-outline" src="\assets\App-topbar.svg" alt="" />
    </button>

    <div class="button7-wrapper">
      <div
        class="button7"
        role="button"
        tabindex="0"
        aria-haspopup="true"
        [attr.aria-expanded]="isUserMenuOpen"
        [class.button7-active]="isUserMenuOpen"
        (click)="toggleUserMenu()"
        (keyup.enter)="toggleUserMenu()"
      >
        <div class="container8">
          <div class="ag">{{ userInitials }}</div>
        </div>
        <div class="container9">
          <div class="container10">
            <div class="akashg">{{ userName }}</div>
          </div>
          <div class="container11">
            <div class="noc-lead">{{ userRole }}</div>
          </div>
        </div>
        <img class="icon3" [class.icon3-open]="isUserMenuOpen" src="\assets\Dropdown-topbar.svg" alt="" />
      </div>

      <div class="user-menu" *ngIf="isUserMenuOpen">
        <button type="button" class="user-menu-item" (click)="onUserMenuAction('preferences')">User Preferences</button>
        <button type="button" class="user-menu-item" (click)="onUserMenuAction('profile')">My Profile</button>
        <button type="button" class="user-menu-item" (click)="onUserMenuAction('settings')">Settings</button>
        <button type="button" class="user-menu-item" (click)="onUserMenuAction('logout')">Logout</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== Topbar (mobile) ===== -->
<header class="m-topbar" *ngIf="variant === 'mobile'">
  <img class="m-logo" src="/assets/Airtel-logo 5.png" alt="Airtel" />

  <div class="m-search">
    <img class="m-search-icon" src="/assets/Search-topbar.svg" alt="" />
    <input
      type="text"
      class="m-search-input"
      [ngModel]="searchQuery"
      (ngModelChange)="onSearchQueryInput($event)"
      [placeholder]="searchPlaceholder"
      (keyup.enter)="onSearch()"
      aria-label="Search service requests, escalations and incidents"
    />
  </div>

  <div class="m-topbar-actions">
    <button type="button" class="m-icon-btn" aria-label="Documents" (click)="documentsClick.emit()">
      <img src="/assets/Documentation-topbar.svg" alt="" />
    </button>
    <button type="button" class="m-icon-btn" aria-label="Notifications" (click)="notificationsClick.emit()">
      <img src="/assets/App-topbar.svg" alt="" />
    </button>

    <div class="m-user-wrapper">
      <div
        class="m-user-trigger"
        role="button"
        tabindex="0"
        aria-haspopup="true"
        [attr.aria-expanded]="isUserMenuOpen"
        [class.m-user-trigger-active]="isUserMenuOpen"
        (click)="toggleUserMenu()"
        (keyup.enter)="toggleUserMenu()"
      >
        <div class="m-user-avatar">{{ userInitials }}</div>
        <div class="m-user-text">
          <div class="m-user-name">{{ userName }}</div>
          <div class="m-user-role">{{ userRole }}</div>
        </div>
        <img class="m-user-caret" [class.m-user-caret-open]="isUserMenuOpen" src="/assets/Dropdown-topbar.svg" alt="" />
      </div>

      <div class="m-user-menu" *ngIf="isUserMenuOpen">
        <button type="button" (click)="onUserMenuAction('preferences')">User Preferences</button>
        <button type="button" (click)="onUserMenuAction('profile')">My Profile</button>
        <button type="button" (click)="onUserMenuAction('settings')">Settings</button>
        <button type="button" (click)="onUserMenuAction('logout')">Logout</button>
      </div>
    </div>
  </div>
</header>

<div class="m-welcome" *ngIf="variant === 'mobile'">
  <div class="m-welcome-title-row">
    <span class="m-welcome-title">{{ portalTitle }}</span>
    <img class="m-welcome-emoji" src="/assets/welcome-dude.png" alt="" />
  </div>
  <div class="m-welcome-subtitle">{{ portalSubtitle }}</div>
</div>
