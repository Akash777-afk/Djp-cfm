<div class="upm-backdrop" (click)="onBackdropClick()">
  <div class="upm-card" role="dialog" aria-modal="true" aria-labelledby="upm-title" (click)="$event.stopPropagation()">

    <button type="button" class="upm-close" aria-label="Close" (click)="close.emit()">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 6L6 18M6 6l12 12" stroke="#6a7282" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <div class="upm-header">
      <div class="upm-header-icon">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="8" r="4" stroke="#e20110" stroke-width="1.8"/>
          <path d="M4 20c0-3.7 3.6-6 8-6s8 2.3 8 6" stroke="#e20110" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="upm-header-text">
        <div class="upm-title" id="upm-title">User Preference</div>
        <div class="upm-subtitle">Manage your dashboard widgets.</div>
      </div>
    </div>

    <div class="upm-divider"></div>

    <div class="upm-tabs">
      <div class="upm-tabs-track">
        <div class="upm-tabs-pill" [class.upm-tabs-pill-right]="activeTab === 'glanceable'"></div>
        <button
          type="button"
          class="upm-tab"
          [class.is-active]="activeTab === 'applications'"
          (click)="setTab('applications')"
        >Applications</button>
        <button
          type="button"
          class="upm-tab"
          [class.is-active]="activeTab === 'glanceable'"
          (click)="setTab('glanceable')"
        >Glanceable</button>
      </div>
    </div>

    <ng-container *ngIf="activeTab === 'glanceable'; else applicationsPlaceholder">
      <div class="upm-body">
        <div
          class="upm-list-panel"
          cdkDropList
          #availableList="cdkDropList"
          [cdkDropListData]="availableGlanceable"
          [cdkDropListConnectedTo]="[selectedList]"
          (cdkDropListDropped)="drop($event)"
        >
          <div class="upm-list-header upm-list-header-available">Available Glanceable</div>
          <div class="upm-list-items">
            <div class="upm-list-item" *ngFor="let item of availableGlanceable" cdkDrag>{{ item }}</div>
          </div>
        </div>

        <div
          class="upm-list-panel"
          cdkDropList
          #selectedList="cdkDropList"
          [cdkDropListData]="selectedGlanceable"
          [cdkDropListConnectedTo]="[availableList]"
          (cdkDropListDropped)="drop($event)"
        >
          <div class="upm-list-header upm-list-header-selected">Selected Glanceable</div>
          <div class="upm-list-items">
            <div class="upm-list-item" *ngFor="let item of selectedGlanceable" cdkDrag>{{ item }}</div>
          </div>
        </div>
      </div>

    </ng-container>

    <ng-template #applicationsPlaceholder>
      <div class="upm-placeholder">Application preferences are coming soon.</div>
    </ng-template>

    <div class="upm-footer">
      <div class="upm-footer-left" *ngIf="activeTab === 'glanceable'">
        <label class="upm-minimize">
          <input type="checkbox" [(ngModel)]="minimizeGlanceableItem">
          Minimize Glanceable item
        </label>
        <div class="upm-hint">* Drag and Drop between lists to choose preference.</div>
      </div>

      <button type="button" class="upm-done" (click)="onDone()">Done</button>
    </div>

  </div>
</div>
