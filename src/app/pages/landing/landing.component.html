<div class="aop-scale-wrapper" [style.--aop-scale]="scale">
<div class="aop-canvas">

  <!-- ===== Analytics Overview section ===== -->
  <div class="aop-header" id="analytics-overview-section">
    <img class="aop-header-icon" src="/assets/landing/Icon-5.svg" alt="" />
    <div class="aop-header-text">
      <div class="aop-title">{{ analyticsTitle }}</div>
      <div class="aop-subtitle">{{ analyticsSubtitle }}</div>
    </div>

    <div class="aop-header-actions">
      <button type="button" class="aop-icon-btn" aria-label="Settings" (click)="onSettingsClick()">
        <img src="/assets/landing/Icon-4.svg" alt="" />
      </button>
      <button type="button" class="aop-icon-btn" aria-label="Add" (click)="onAddClick()">
        <img src="/assets/landing/Icon-3.svg" alt="" />
      </button>
      <button type="button" class="aop-icon-btn" aria-label="Open externally" (click)="onExternalLinkClick()">
        <img src="/assets/landing/Icon-2.svg" alt="" />
      </button>
    </div>
  </div>

  <!-- ===== Main nav tabs ===== -->
  <div class="aop-tab-bar">
    <button
      type="button"
      class="aop-tab-btn"
      *ngFor="let tab of navTabs"
      [class.aop-tab-active]="tab.active"
      (click)="setActiveTab(tab)"
    >{{ tab.label }}</button>
  </div>
  <div class="aop-separator"></div>

  <!-- ===== Main 2x2 grid ===== -->
  <app-sr-overview
    variant="desktop"
    [top]="getMainCardPosition('sr').top"
    [left]="getMainCardPosition('sr').left"
  ></app-sr-overview>

  <app-landing-incident-management
    variant="desktop"
    [top]="getMainCardPosition('incident').top"
    [left]="getMainCardPosition('incident').left"
  ></app-landing-incident-management>

  <app-landing-change-management
    variant="desktop"
    [top]="getMainCardPosition('change').top"
    [left]="getMainCardPosition('change').left"
  ></app-landing-change-management>

  <app-landing-escalation-matrix
    variant="desktop"
    [top]="getMainCardPosition('escalation').top"
    [left]="getMainCardPosition('escalation').left"
  ></app-landing-escalation-matrix>

</div>
</div>

<!-- =========================================================
     Responsive layout (< 1024px) — natively-flowing rebuild.
     ========================================================= -->
<div class="aop-mobile-layout">

  <div class="aop-m-header" id="analytics-overview-section-m">
    <div class="aop-m-header-row">
      <img class="aop-m-header-icon" src="/assets/landing/Icon-5.svg" alt="" />
      <div class="aop-m-title">{{ analyticsTitle }}</div>
    </div>
    <div class="aop-m-subtitle">{{ analyticsSubtitle }}</div>
  </div>

  <div class="aop-m-tabs">
    <button
      type="button"
      class="aop-m-tab-btn"
      *ngFor="let tab of navTabs"
      [class.aop-m-tab-active]="tab.active"
      (click)="setActiveTab(tab)"
    >{{ tab.label }}</button>
  </div>

  <div class="aop-m-cards">
    <app-sr-overview variant="mobile" [order]="mainCardOrder.indexOf('sr')"></app-sr-overview>
    <app-landing-incident-management variant="mobile" [order]="mainCardOrder.indexOf('incident')"></app-landing-incident-management>
    <app-landing-escalation-matrix variant="mobile" [order]="mainCardOrder.indexOf('escalation')"></app-landing-escalation-matrix>
    <app-landing-change-management variant="mobile" [order]="mainCardOrder.indexOf('change')"></app-landing-change-management>
  </div>

</div>
