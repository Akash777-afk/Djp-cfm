<div class="the-djp-scale-wrapper" [style.--djp-scale]="scale">
<div class="the-djp">

  <app-header-part
    variant="desktop"
    [portalTitle]="portalTitle"
    [portalSubtitle]="portalSubtitle"
    [searchPlaceholder]="searchPlaceholder"
    [searchQuery]="searchQuery"
    (searchQueryChange)="searchQuery = $event"
    (search)="onSearch()"
    [userInitials]="userInitials"
    [userName]="userName"
    [userRole]="userRole"
    [isUserMenuOpen]="isUserMenuOpen"
    (isUserMenuOpenChange)="isUserMenuOpen = $event"
    (documentsClick)="onDocumentsClick()"
    (notificationsClick)="onNotificationsClick()"
    (userMenuAction)="onUserMenuAction($event)"
  ></app-header-part>

  <app-colorful-tiles variant="desktop" [selectedGlanceable]="selectedGlanceable"></app-colorful-tiles>

  <app-analytics-overview
    variant="desktop"
    [navTabs]="navTabs"
    (tabSelect)="setActiveTab($event)"
    [activeInterface]="activeInterface"
    (interfaceSelect)="setInterface($event)"
  ></app-analytics-overview>

  <app-sr-overview
    variant="desktop"
    [top]="getCardPosition('sr').top"
    [left]="getCardPosition('sr').left"
  ></app-sr-overview>

  <app-landing-incident-management
    variant="desktop"
    [top]="getCardPosition('incident').top"
    [left]="getCardPosition('incident').left"
  ></app-landing-incident-management>

  <app-landing-escalation-matrix
    variant="desktop"
    [top]="getCardPosition('escalation').top"
    [left]="getCardPosition('escalation').left"
  ></app-landing-escalation-matrix>

  <app-landing-change-management
    variant="desktop"
    [top]="getCardPosition('change').top"
    [left]="getCardPosition('change').left"
  ></app-landing-change-management>

</div>
</div>

<!-- =========================================================
     Responsive layout (< 1024px) — natively-flowing rebuild of the
     canvas above, sharing the same lifted-up state/handlers.
     ========================================================= -->
<div class="mobile-layout">

  <app-header-part
    variant="mobile"
    [portalTitle]="portalTitle"
    [portalSubtitle]="portalSubtitle"
    [searchPlaceholder]="searchPlaceholder"
    [searchQuery]="searchQuery"
    (searchQueryChange)="searchQuery = $event"
    (search)="onSearch()"
    [userInitials]="userInitials"
    [userName]="userName"
    [userRole]="userRole"
    [isUserMenuOpen]="isUserMenuOpen"
    (isUserMenuOpenChange)="isUserMenuOpen = $event"
    (documentsClick)="onDocumentsClick()"
    (notificationsClick)="onNotificationsClick()"
    (userMenuAction)="onUserMenuAction($event)"
  ></app-header-part>

  <app-colorful-tiles variant="mobile" [selectedGlanceable]="selectedGlanceable"></app-colorful-tiles>

  <app-analytics-overview
    variant="mobile"
    [navTabs]="navTabs"
    (tabSelect)="setActiveTab($event)"
    [activeInterface]="activeInterface"
    (interfaceSelect)="setInterface($event)"
  ></app-analytics-overview>

  <!-- ===== Analytics Cards ===== -->
  <div class="m-cards">

    <app-sr-overview variant="mobile" [order]="cardOrder.indexOf('sr')"></app-sr-overview>

    <app-landing-incident-management variant="mobile" [order]="cardOrder.indexOf('incident')"></app-landing-incident-management>

    <app-landing-escalation-matrix variant="mobile" [order]="cardOrder.indexOf('escalation')"></app-landing-escalation-matrix>

    <app-landing-change-management variant="mobile" [order]="cardOrder.indexOf('change')"></app-landing-change-management>

  </div>
</div>

<app-user-preference-modal
  *ngIf="isUserPreferenceModalOpen"
  [availableGlanceable]="availableGlanceable"
  [selectedGlanceable]="selectedGlanceable"
  (close)="closeUserPreferenceModal()"
></app-user-preference-modal>
