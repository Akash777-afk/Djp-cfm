<!-- ===== Change Management Analytics Card (desktop) ===== -->
<div
  class="frame-parent4 grid-card"
  *ngIf="variant === 'desktop'"
  [style.top.px]="top"
  [style.left.px]="left"
  role="button"
  tabindex="0"
  (click)="onExpandCard()"
  (keyup.enter)="onExpandCard()"
>

  <!-- Card header -->
  <div class="frame-parent5">
    <div class="frame-group">
      <img class="frame-child" src="\assets/landing/Vector-3.svg" alt="" />
      <div class="change-management-parent">
        <div class="sr-overview2">{{ changeCardTitle }}</div>
        <div class="manage-service-requests">{{ changeCardSubtitle }}</div>
      </div>
    </div>
    <img
      class="icon-parkfull-screen-one"
      src="\assets/landing/Expand.svg"
      alt="Expand Change management"
      role="button"
      tabindex="0"
      (click)="$event.stopPropagation(); onExpandCard()"
      (keyup.enter)="$event.stopPropagation(); onExpandCard()"
    />
  </div>

  <!-- Status breakdown: bar chart (6 bars incl. "All Changes") on the left,
       a matching pill list on the right — replaces the old KPI-tiles-then-
       chart stacked layout. -->
  <div class="cm-analytics-row">

    <div class="cm-chart-col">
      <div class="cm-bar-parent">
        <div class="cm-y-label" *ngFor="let y of yLabels" [style.top.px]="y.top">{{ y.label }}</div>
        <div class="cm-bar-col" *ngFor="let bar of bars">
          <div
            class="cm-bar-item"
            [class.cm-bar-active]="bar.active"
            [class.cm-bar-raised]="bar.label === 'Scheduled' || bar.label === 'Rejected'"
            [style.height.px]="bar.height"
          ></div>
        </div>
      </div>
      <div class="cm-x-labels">
        <div class="cm-x-label" *ngFor="let bar of bars">{{ bar.label }}</div>
      </div>
    </div>

    <div class="cm-pills-col">
      <div
        class="cm-pill"
        *ngFor="let card of pillCards"
        [style.backgroundColor]="card.bg"
        [style.color]="card.color"
      >
        <span class="cm-pill-label">{{ card.label }}</span>
        <span class="cm-pill-value">{{ card.count }}</span>
      </div>
    </div>

  </div>

  <app-card-loading-overlay [loading]="isLoading"></app-card-loading-overlay>
</div>

<!-- ===== Change management (mobile) ===== -->
<div
  class="m-card"
  *ngIf="variant === 'mobile'"
  [style.order]="order"
  role="button"
  tabindex="0"
  (click)="onExpandCard()"
  (keyup.enter)="onExpandCard()"
>
  <div class="m-card-header">
    <img class="m-card-icon" src="/assets/landing/Vector-3.svg" alt="" />
    <div>
      <div class="m-card-title">{{ changeCardTitle }}</div>
      <div class="m-card-subtitle">{{ changeCardSubtitle }}</div>
    </div>
  </div>

  <div class="m-stat-tiles">
    <div
      class="m-stat-tile"
      *ngFor="let card of statCards"
      [style.backgroundColor]="card.bg"
      [style.borderColor]="card.color"
      [style.color]="card.color"
    >
      <b>{{ card.count }}</b>
      <span>{{ card.label }}</span>
    </div>
  </div>

  <div class="m-bar-chart">
    <div class="m-bar-col" *ngFor="let bar of bars">
      <div class="m-bar" [class.m-bar-active]="bar.active" [style.height.%]="(bar.height / 182) * 100"></div>
      <span class="m-bar-label">{{ bar.label }}</span>
    </div>
  </div>

  <app-card-loading-overlay [loading]="isLoading"></app-card-loading-overlay>
</div>
