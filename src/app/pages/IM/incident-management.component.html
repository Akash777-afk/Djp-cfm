<div class="the-djp-incident-management-scale-wrapper" [style.--djp-scale]="scale">
<div class="the-djp-incident-management">

  <!-- ===== Welcome banner ===== -->
  <div class="im-welcome">Welcome back, {{ userName }} !</div>
  <button type="button" class="im-quick-btn im-quick-call" aria-label="Broadcast" (click)="onCallClick()">
    <img src="/assets/incident-management/IM-Broadcast.svg" alt="" />
    <span class="header-icon-tooltip">Broadcast</span>
  </button>
  <button type="button" class="im-quick-btn im-quick-book" aria-label="Knowledge Management" (click)="onBookClick()">
    <img src="/assets/escalation-matrix/Knowledge-managemnt.svg" alt="" />
    <span class="header-icon-tooltip">Knowledge Management</span>
  </button>
  <app-nstt-status
    [statTiles]="statTiles"
    [activeKey]="activeCardKey"
    (tileClick)="setActiveCard($event)"
  ></app-nstt-status>

  <app-all-nstts
    [nsttRows]="nsttRows"
    [statusFilter]="statusFilter"
    [groupOptionsSource]="groupOptions"
    [selectedColumnOrder]="selectedColumnOrder"
    (binChange)="onBinChange($event)"
    (openColumnSettings)="openColumnSettings()"
    (expandRow)="onExpandRow($event)"
  ></app-all-nstts>

  <!-- ===== Footer ===== -->
  <div class="the-main-page">
    <a class="tier-1" href="https://www.tieroneoss.com" target="_blank" rel="noopener noreferrer">
      <div class="powered-by">Powered by</div>
      <img class="t1-4-icon" src="\assets/shared/im-3-tier1.png" alt="" />
    </a>
  </div>

</div>
</div>

<!-- Placed outside the scaled canvas wrapper on purpose — position:fixed
     inside a transform:scale ancestor is contained by that ancestor, not
     the real viewport. Same placement convention as NOC Portal's modals. -->
<app-nstt-sr-drawer [row]="expandedRow" (closed)="onDrawerClosed()"></app-nstt-sr-drawer>

<app-column-settings-modal
  [open]="isColumnSettingsOpen"
  [selectedKeys]="selectedColumnOrder"
  (save)="onColumnSettingsSave($event)"
  (closed)="onColumnSettingsClosed()"
></app-column-settings-modal>
