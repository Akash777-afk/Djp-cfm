<div class="ib-overlay" *ngIf="isOpen" role="presentation" (click)="close()">
  <div class="ib-card" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">

    <div class="ib-header">
      <div class="ib-title">Inventory Blueprint</div>
      <div class="ib-header-actions">
        <button type="button" class="ib-icon-btn" [class.spinning]="isRefreshing" aria-label="Refresh" (click)="onRefresh()">
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16.5 10a6.5 6.5 0 1 1-2.1-4.8M16.5 3v4h-4" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button type="button" class="ib-icon-btn" aria-label="Close" (click)="close()">
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 5L15 15M15 5L5 15" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="ib-body">
      <div class="ib-sections-grid">
        <div class="ib-section" *ngFor="let section of sections">

          <div class="ib-section-head">
            <span class="ib-section-icon" [ngSwitch]="section.key">
              <svg *ngSwitchCase="'transport'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="1" y="6" width="13" height="10" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
                <path d="M14 10H18L21 13V16H14V10Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                <circle cx="6" cy="18.5" r="1.8" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="17.5" cy="18.5" r="1.8" stroke="currentColor" stroke-width="1.6"/>
              </svg>
              <svg *ngSwitchCase="'last-mile'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.6"/>
                <path d="M12 5.5V9.4M12 14.6V18.5M6.3 8.7L9.7 10.7M14.3 13.3L17.7 15.3M17.7 8.7L14.3 10.7M9.7 13.3L6.3 15.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
              <svg *ngSwitchCase="'elan'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="5" cy="5" r="2.4" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="19" cy="5" r="2.4" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="12" cy="19" r="2.4" stroke="currentColor" stroke-width="1.6"/>
                <path d="M5 7.4V12C5 14 6.5 15.4 8 16.2M19 7.4V12C19 14 17.5 15.4 16 16.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
              <svg *ngSwitchCase="'technical'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="8" y="8" width="8" height="8" rx="1.3" stroke="currentColor" stroke-width="1.6"/>
                <path d="M12 2V5M12 19V22M2 12H5M19 12H22M4.5 4.5L6.7 6.7M17.3 17.3L19.5 19.5M4.5 19.5L6.7 17.3M17.3 6.7L19.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="ib-section-title">{{ section.title }}</span>
          </div>

          <div class="ib-section-card">
            <div class="ib-field" *ngFor="let f of section.fields">
              <div class="ib-field-label">{{ f.label }}</div>
              <div class="ib-field-value">{{ f.value }}</div>
            </div>
          </div>

        </div>
      </div>
    </div>

  </div>
</div>
