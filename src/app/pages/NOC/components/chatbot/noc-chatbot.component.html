<!-- ===== Floating launcher ===== -->
<button
  type="button"
  class="nch-fab"
  *ngIf="!chat.isOpen"
  [class.nch-fab-pulse]="chat.hasUnread"
  (click)="chat.open()"
  aria-label="NOC AI Assistant"
  title="NOC AI Assistant"
>
  <span class="nch-fab-ring" *ngIf="chat.hasUnread" aria-hidden="true"></span>
  <img class="nch-fab-icon" src="/assets/noc-portal/ai-chatbot-robot.png" alt="" aria-hidden="true">
</button>

<!-- ===== Panel ===== -->
<div class="nch-panel" *ngIf="chat.isOpen" [class.nch-panel-minimized]="chat.isMinimized" role="dialog" aria-label="NOC AI Assistant">

  <!-- Header -->
  <div class="nch-header" (click)="chat.isMinimized && chat.restore()">
    <div class="nch-header-icon">
      <img class="nch-header-icon-img" src="/assets/noc-portal/ai-chatbot-robot.png" alt="">
    </div>
    <div class="nch-header-text">
      <div class="nch-header-title">NOC AI Assistant</div>
      <div class="nch-header-subtitle">
        <span class="nch-status-dot" aria-hidden="true"></span>
        Online • Ready to help
      </div>
    </div>
    <div class="nch-header-actions">
      <button type="button" class="nch-icon-btn" *ngIf="chat.messages.length > 0" (click)="onClearConversation(); $event.stopPropagation()" aria-label="Clear conversation" title="Clear conversation">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0v13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V7h10ZM10.5 11v6M13.5 11v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="nch-icon-btn" (click)="chat.isMinimized ? chat.restore() : chat.minimize(); $event.stopPropagation()" [attr.aria-label]="chat.isMinimized ? 'Restore' : 'Minimize'" [title]="chat.isMinimized ? 'Restore' : 'Minimize'">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="nch-icon-btn" (click)="chat.close(); $event.stopPropagation()" aria-label="Close" title="Close">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <ng-container *ngIf="!chat.isMinimized">

    <!-- Body -->
    <div class="nch-body">

      <!-- Welcome state -->
      <div class="nch-welcome" *ngIf="chat.messages.length === 0">
        <div class="nch-welcome-text">Hi! How can I help you with the NOC Portal?</div>
        <div class="nch-quick-grid">
          <button type="button" class="nch-quick-card" *ngFor="let action of quickActions" (click)="onQuickAction(action)">
            <span class="nch-quick-icon" [ngSwitch]="action.icon">
              <svg *ngSwitchCase="'incidents'" viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><line x1="12" y1="9" x2="12" y2="13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="12" y1="17" x2="12.01" y2="17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              <svg *ngSwitchCase="'network'" viewBox="0 0 24 24" width="18" height="18" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18" stroke="currentColor" stroke-width="1.8"/></svg>
              <svg *ngSwitchCase="'escalations'" viewBox="0 0 24 24" width="18" height="18" fill="none"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="17 6 23 6 23 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <svg *ngSwitchCase="'sr'" viewBox="0 0 24 24" width="18" height="18" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><line x1="7" y1="9" x2="17" y2="9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="7" y1="13" x2="17" y2="13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="7" y1="17" x2="12" y2="17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              <svg *ngSwitchCase="'alerts'" viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              <svg *ngSwitchCase="'analysis'" viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M3 3v18h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 15l4-4 3 3 5-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span class="nch-quick-label">{{ action.label }}</span>
          </button>
        </div>
      </div>

      <!-- Messages -->
      <div class="nch-messages" *ngIf="chat.messages.length > 0">
        <div class="nch-msg" *ngFor="let m of chat.messages; trackBy: trackByMessageId" [class.nch-msg-user]="m.sender === 'user'" [class.nch-msg-ai]="m.sender === 'ai'">

          <div class="nch-msg-avatar" *ngIf="m.sender === 'ai'">
            <img class="nch-avatar-img" src="/assets/noc-portal/ai-chatbot-robot.png" alt="">
          </div>

          <div class="nch-bubble">
            <!-- Plain text -->
            <p class="nch-bubble-text" *ngIf="m.text">{{ m.text }}</p>

            <!-- Structured dashboard-style summary -->
            <div class="nch-summary" *ngIf="m.rows">
              <div class="nch-summary-title" *ngIf="m.title">{{ m.title }}</div>
              <div class="nch-summary-row" *ngFor="let r of m.rows">
                <span class="nch-summary-icon">{{ r.icon }}</span>
                <span class="nch-summary-label">{{ r.label }}</span>
                <span class="nch-summary-value" [style.color]="r.color">{{ r.value }}</span>
              </div>
              <div class="nch-summary-total" *ngIf="m.total">
                <span>{{ m.total.label }}</span>
                <b>{{ m.total.value }}</b>
              </div>
            </div>

            <button type="button" class="nch-msg-action" *ngIf="m.actionLabel" (click)="onMessageAction(m)">{{ m.actionLabel }}</button>
          </div>
        </div>

        <!-- AI thinking -->
        <div class="nch-msg nch-msg-ai" *ngIf="chat.isThinking">
          <div class="nch-msg-avatar">
            <img class="nch-avatar-img" src="/assets/noc-portal/ai-chatbot-robot.png" alt="">
          </div>
          <div class="nch-bubble nch-thinking">
            <span class="nch-thinking-text">AI is analyzing</span>
            <span class="nch-dot"></span>
            <span class="nch-dot"></span>
            <span class="nch-dot"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="nch-input-row">
      <input
        class="nch-input"
        type="text"
        placeholder="Ask about the NOC Portal..."
        [(ngModel)]="draft"
        (keydown)="onKeydown($event)"
      />
      <button type="button" class="nch-send-btn" (click)="onSend()" [disabled]="!draft.trim()" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </ng-container>
</div>
